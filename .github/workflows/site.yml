name: Website

# Deploys site/ to GitHub Pages (forge.stellitron.com), with the latest release's VirusTotal
# results next to it (virustotal.json for the page, virustotal-badge.json for the README badge).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", "scripts/virustotal.mjs"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Add the latest release's VirusTotal results
        run: |
          mkdir _site && cp -R site/. _site/
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern virustotal.json --dir _vt 2>/dev/null; then
            cp _vt/virustotal.json _site/virustotal.json
          else
            echo "::notice::The latest release has no VirusTotal results; the page hides that line."
          fi
          node scripts/virustotal.mjs badge _site/virustotal.json > _site/virustotal-badge.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
