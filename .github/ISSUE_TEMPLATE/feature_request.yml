name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Forge help? Sketches and examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
