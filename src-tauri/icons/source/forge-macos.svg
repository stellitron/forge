  </defs>
  <g transform="translate(100 100)">
    <rect width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
    <rect width="824" height="824" rx="185" fill="url(#shine)"/>
    <g transform="translate(412 412) scale(20) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
